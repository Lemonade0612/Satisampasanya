services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: backend
    environment:
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Set the existing administrator email}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set both HTTPS website origins}
      SEED_DEMO: "false"
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      LOCAL_HELPLINES: ${LOCAL_HELPLINES:-[]}
      NLLB_URL: http://translation:3002
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-sati}
    volumes:
      - sati-data:/data
    restart: unless-stopped
  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
  admin:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: admin
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
    restart: unless-stopped
  translation:
    build:
      context: ..
      dockerfile: translation/Dockerfile
    volumes:
      - sati-models:/models
    restart: unless-stopped
volumes:
  sati-data:
  sati-models:
