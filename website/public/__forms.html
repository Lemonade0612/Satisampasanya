<!doctype html>
<!-- Static copies of the React forms so Netlify Forms can detect them at deploy time. Not linked from the site. -->
<html lang="en">
  <head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>forms</title></head>
  <body>
    <form name="feedback" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="feedback" />
      <input name="bot-field" />
      <input name="topic" />
      <input name="name" />
      <input name="age" />
      <input name="email" />
      <textarea name="message"></textarea>
      <input name="consent" />
    </form>
    <form name="booking" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="booking" />
      <input name="bot-field" />
      <input name="date" />
      <input name="time" />
      <input name="name" />
      <input name="email" />
      <textarea name="notes"></textarea>
    </form>
  </body>
</html>
